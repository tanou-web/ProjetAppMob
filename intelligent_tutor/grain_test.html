<script type="text/javascript">// Ajoutez ce script à la fin de votre page
document.addEventListener('DOMContentLoaded', function () {
    // Gestionnaire pour les onglets
    const tabButtons = document.querySelectorAll('[data-bs-toggle="pill"]');

    tabButtons.forEach(button => {
        button.addEventListener('click', function (e) {
            e.preventDefault();

            // Récupère l'ID de la cible
            const targetId = this.getAttribute('data-bs-target');
            const targetTab = document.querySelector(targetId);

            // Désactive tous les onglets
            document.querySelectorAll('.tab-pane').forEach(tab => {
                tab.classList.remove('show', 'active');
            });

            // Désactive tous les boutons
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });

            // Active l'onglet et le bouton courant
            this.classList.add('active');
            targetTab.classList.add('show', 'active');
        });
    });
});

// AJOUT ONGLETS
// Fonction pour les onglets Curricula
function showCurriculaTab(tabId, button) {
	// Masquer tous les panneaux curricula
	const curriculaPanes = document.querySelectorAll('.curricula-pane');
	curriculaPanes.forEach(pane => {
		pane.style.display = 'none';
	});
	
	// Afficher le panneau sélectionné
	const activePane = document.getElementById(tabId);
	if (activePane) {
		activePane.style.display = 'block';
	}
	
	// Gérer les classes actives des boutons curricula
	const curriculaButtons = button.parentNode.querySelectorAll('.nav-link');
	curriculaButtons.forEach(btn => {
		btn.classList.remove('active');
	});
	button.classList.add('active');
}
